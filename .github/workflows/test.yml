name: Test Workspace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      # uv provides the interpreter, pinned by the matrix rather than
      # taken from the runner image.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        version: "0.11.14"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Verify the committed lockfile satisfies pyproject.toml
      run: uv lock --locked

    - name: Install workspace dependencies
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest

    - name: Run linting (black)
      run: uv run black --check .
