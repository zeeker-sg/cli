name: Test Workspace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      # uv provides the interpreter, pinned by the matrix rather than
      # taken from the runner image.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.11.14"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Verify the committed lockfile satisfies pyproject.toml
      run: uv lock --locked

    - name: Install workspace dependencies
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest

    - name: Run linting (black)
      run: uv run black --check .
